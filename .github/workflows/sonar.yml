name: SonarQube Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: [self-hosted, internal-runner]
    # Sonar runs on a k8s self-hosted runner that talks to Sonar via
    # cluster-internal DNS (sonarqube.devops.svc.cluster.local). When ARC
    # is unhealthy and no runner picks up the job, GitHub fails the check
    # after a long timeout. Treat the scan as advisory rather than blocking:
    # quality gate status is still visible in the Sonar UI, but a runner
    # outage does not gate merges.
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JRE)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Sonar Scanner
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -sSLo /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          sudo unzip -o /tmp/sonar-scanner.zip -d /opt
          sudo ln -sf /opt/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner /usr/local/bin/sonar-scanner

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner             -Dsonar.projectKey=cntm-labs_nucleus             -Dsonar.sources=.             -Dsonar.host.url=http://sonarqube.devops.svc.cluster.local:9000             -Dsonar.login=${{ secrets.SONAR_TOKEN }}
